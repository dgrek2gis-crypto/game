    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .brand-logo {
      display: block;
      margin: 0 auto;
      width: 110px;
      height: auto;
    }

    header {
      background: var(--bg-card);
      border-radius: var(--border-radius);
      padding: 18px 20px;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(0, 0, 0, 0.04);
      text-align: center;
      position: relative;
    }

    .logo-badge {
      display: inline-block;
      background: var(--accent-green);
      color: white;
      font-weight: 800;
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 20px;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #222;
      margin-bottom: 4px;
    }

    header p {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 14px;
    }

    .progress-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .progress-bar-bg {
      width: 100%;
      height: 12px;
      background: var(--bg-card-alt);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #86ca38, #a1db58);
      border-radius: 10px;
      transition: width 0.4s ease-out;
    }

    .bingo-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: 100%;
    }

    @media (max-width: 320px) {
      .bingo-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
    }

    .bingo-card {
      background: var(--bg-card);
      border-radius: 16px;
      min-height: 86px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      box-shadow: var(--shadow-sm);
      border: 2px solid transparent;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.3s ease, border-color 0.3s ease;
    }

    .bingo-card:active {
      transform: scale(0.95);
    }

    .bingo-card .icon {
      font-size: 20px;
      margin-bottom: 4px;
    }

    .bingo-card .icon-img {
      width: 66%;
      height: auto;
      max-height: 60px;
      object-fit: contain;
      margin-bottom: 4px;
    }

    .bingo-card .title {
      font-size: 11px;
      font-weight: 600;
      line-height: 1.3;
      color: #333;
      word-break: normal;
      overflow-wrap: break-word;
      hyphens: manual;
      -webkit-hyphens: manual;
      text-wrap: wrap;
    }

    .bingo-card .floor-tag {
      margin-top: 6px;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 8px;
      background: var(--bg-card-alt);
      color: var(--text-muted);
    }

    .bingo-card.completed {
      background: var(--accent-green-light);
      border-color: var(--accent-green);
    }

    .bingo-card.completed .title {
      color: #2b5403;
    }

    .bingo-card.completed .floor-tag {
      background: var(--accent-green);
      color: white;
    }

    .bingo-card.completed::after {
      content: '✓';
      position: absolute;
      top: 4px;
      right: 6px;
      font-size: 11px;
      font-weight: 900;
      color: var(--accent-green);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .shake {
      animation: shake 0.4s ease-in-out;
      border-color: #f87171 !important;
      background-color: #fee2e2 !important;
    }

    .footer-actions {
      display: flex;
      justify-content: center;
      margin-top: 8px;
    }

    .checklist {
      display: none;
      background: var(--bg-card);
      border-radius: var(--border-radius);
      padding: 18px 20px;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(0, 0, 0, 0.04);
    }

    .checklist.visible {
      display: block;
    }

    .checklist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .checklist-title {
      font-size: 18px;
      font-weight: 800;
      color: #222;
    }

    .checklist-count {
      font-size: 12px;
      font-weight: 700;
      color: #2b5403;
      background: var(--accent-green-light);
      padding: 3px 10px;
      border-radius: 20px;
    }

    .checklist-sub {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .checklist-items {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 14px;
    }

    .checklist-item {
      display: flex;
      gap: 12px;
      padding: 12px;
      border-radius: 14px;
      background: var(--bg-main);
      border: 1px solid #e2ddca;
    }

    .ci-icon-wrap {
      flex: none;
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .checklist-item .ci-icon {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }

    .checklist-item .ci-icon-emoji {
      font-size: 26px;
    }

    .ci-body {
      flex: 1;
      min-width: 0;
    }

    .ci-head {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }

    .ci-check {
      font-size: 12px;
      font-weight: 900;
      color: #fff;
      background: var(--accent-green);
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: none;
    }

    .ci-title {
      font-size: 14px;
      font-weight: 800;
      color: #222;
    }

    .ci-floor {
      font-size: 10px;
      font-weight: 700;
      color: #2b5403;
      background: var(--accent-green-light);
      padding: 2px 8px;
      border-radius: 8px;
      text-transform: lowercase;
    }

    .ci-text {
      font-size: 12.5px;
      line-height: 1.5;
      color: var(--text-muted);
    }

    .ci-text a {
      color: #3b7a12;
      font-weight: 700;
      text-decoration: underline;
    }

    .ci-text a:hover {
      color: var(--accent-green-hover);
    }

    .explain-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .explain-icon {
      width: 48px;
      height: 48px;
      object-fit: contain;
      flex: none;
    }

    .explain-floor {
      font-size: 12px;
      font-weight: 700;
      color: #2b5403;
      background: var(--accent-green-light);
      padding: 3px 10px;
      border-radius: 8px;
      text-transform: lowercase;
    }

    .explain-text {
      font-size: 14px;
      line-height: 1.55;
      color: var(--text-muted);
      overflow-wrap: break-word;
      hyphens: auto;
      -webkit-hyphens: auto;
    }

    .explain-text a {
      color: #3b7a12;
      font-weight: 700;
      text-decoration: underline;
    }

    .pdf-memo {
      position: fixed;
      left: -9999px;
      top: 0;
      width: 794px;
      min-height: 1123px;
      box-sizing: border-box;
      padding: 32px 40px;
      background: #f6f3e6;
      color: #333333;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .pdf-head {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 18px;
    }

    .pdf-logo {
      width: 72px;
      height: auto;
      margin-bottom: 4px;
    }

    .pdf-title {
      font-size: 24px;
      font-weight: 800;
      color: #222222;
    }

    .pdf-items {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .pdf-group-title {
      font-size: 14px;
      font-weight: 800;
      color: #2b5403;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-bottom: 6px;
      border-bottom: 1px solid #d6d0be;
      padding-bottom: 3px;
    }

    .pdf-item {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .pdf-item .pi-icon {
      width: 30px;
      height: 30px;
      object-fit: contain;
      flex: none;
    }

    .pdf-item .pi-emoji {
      font-size: 20px;
      flex: none;
    }

    .pdf-item .pi-body {
      flex: 1;
      min-width: 0;
    }

    .pdf-item .pi-title {
      font-size: 12.5px;
      font-weight: 800;
      color: #222222;
    }

    .pdf-item .pi-text {
      font-size: 10.5px;
      line-height: 1.4;
      color: #666666;
    }

    .pdf-item .pi-text a {
      color: #3b7a12;
      font-weight: 700;
      text-decoration: underline;
    }

    .btn-reset {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(40, 40, 35, 0.4);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: var(--bg-card);
      width: 100%;
      max-width: 460px;
      border-radius: 22px;
      padding: 24px 20px;
      box-shadow: var(--shadow-lg);
      transform: translateY(16px) scale(0.97);
      opacity: 0;
      transition: transform 0.25s cubic-bezier(0.1, 0.9, 0.2, 1), opacity 0.25s ease;
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-overlay.active .modal-card {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-title .modal-icon-img {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }

    .modal-close {
      background: var(--bg-card-alt);
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-muted);
      flex: none;
    }

    .modal-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 18px;
      line-height: 1.4;
    }

    .floors-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 10px;
    }

    .btn-floor {
      background: var(--bg-main);
      border: 2px solid #e2ddca;
      border-radius: 14px;
      padding: 14px 8px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .btn-floor:active {
      transform: scale(0.96);
    }

    .btn-floor.selected {
      background: var(--accent-blue-light);
      border-color: #88bde8;
      color: #1e5380;
    }

    .btn-floor.btn-any {
      grid-column: span 3;
      background: var(--accent-blue-light);
      border-color: var(--accent-blue);
      color: #1a4d77;
    }

    .win-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg-main);
      z-index: 2000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .win-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    canvas#confetti-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2001;
    }

    .win-card {
      background: var(--bg-card);
      border-radius: 24px;
      padding: 24px 18px;
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 440px;
      z-index: 2002;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .win-badge {
      font-size: 48px;
    }

    .win-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-main);
    }

    .win-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .win-checklist-title {
      font-size: 15px;
      font-weight: 800;
      color: #222;
      text-align: left;
      margin-top: 4px;
    }

    .win-checklist {
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: left;
      max-height: 34vh;
      overflow-y: auto;
      padding-right: 4px;
    }

    .win-group-title {
      font-size: 11px;
      font-weight: 800;
      color: #2b5403;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-bottom: 4px;
      border-bottom: 1px solid #d6d0be;
      padding-bottom: 2px;
    }

    .win-item {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .win-item-icon {
      width: 32px;
      height: 32px;
      object-fit: contain;
      flex: none;
    }

    .win-item-emoji {
      font-size: 22px;
      flex: none;
    }

    .win-item-body {
      flex: 1;
      min-width: 0;
    }

    .win-item-title {
      font-size: 14px;
      font-weight: 800;
      color: #222;
    }

    .win-item-text {
      font-size: 12.5px;
      line-height: 1.45;
      color: var(--text-muted);
      overflow-wrap: break-word;
      hyphens: auto;
      -webkit-hyphens: auto;
    }

    .win-item-text a {
      color: #3b7a12;
      font-weight: 700;
      text-decoration: underline;
    }

    .email-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #ddd;
      font-size: 14px;
      outline: none;
    }

    .email-input:focus {
      border-color: var(--accent-green);
    }

    .btn-secondary {
      width: 100%;
      background: var(--accent-blue-light);
      color: #1b4f7a;
      border: 1px solid var(--accent-blue);
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary {
      width: 100%;
      background: var(--accent-green);
      color: white;
      border: none;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(134, 202, 56, 0.3);
    }

    .notification {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: #2b5403;
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--shadow-md);
      z-index: 3000;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .notification.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

        <span class="explain-floor" id="explain-floor"></span>

      <div class="explain-text" id="explain-text"></div>

        explain: `В 2ГИС все свои, поэтому мы говорим друг другу «Привет!», даже если ещё не знакомы. Не забудь поздороваться, заходя на любой этаж.` }
    ];

    // Тексты для всплывающих подсказок (без ссылок)
    const PLAIN = {
      11: `Книги и настолки можно взять в корпоративной библиотеке — она находится в Учебном центре, кабинет 9.21. Если не знаешь, что почитать, в маттермосте есть бот «Книги»: он поможет найти нужную книгу или подскажет что-нибудь интересное.`,
      12: `В кабинете 9.05 бесплатно починят личную технику — например, ноутбук или смартфон. Создай тикет в саппорт с темой «ТехноДМС» и дождись ответа.`,
      15: `Для встречи, созвона или командного брейншторма на Планете можно забронировать переговорку: от маленькой комнаты до большого зала.`
    };

    // Варианты названий с мягкими переносами (U+00AD) — используются только если слово не влезает в ячейку
    const HYPH = {
      1: 'При\u00ADнять душ',
      2: 'Вы\u00ADу\u00ADчить ан\u00ADглий\u00ADский',
      3: 'Ос\u00ADво\u00ADить IT-про\u00ADфес\u00ADсию',
      4: 'Схо\u00ADдить на ле\u00ADчеб\u00ADный мас\u00ADсаж',
      5: 'По\u00ADтро\u00ADгать мерч',
      6: 'Уви\u00ADдеть, с чего на\u00ADчал\u00ADся 2ГИС',
      7: 'Про\u00ADкон\u00ADсуль\u00ADти\u00ADро\u00ADвать\u00ADся с вра\u00ADчом',
      8: 'Узнать, где ри\u00ADсу\u00ADют кар\u00ADты',
      9: 'Уви\u00ADдеть, как об\u00ADра\u00ADба\u00ADты\u00ADва\u00ADют\u00ADся за\u00ADцеп\u00ADки',
      10: 'За\u00ADнять\u00ADся спор\u00ADтом',
      11: 'Взять кни\u00ADгу или на\u00ADстоль\u00ADную иг\u00ADру',
      12: 'По\u00ADчи\u00ADнить тех\u00ADни\u00ADку',
      13: 'Вы\u00ADпить чай или кофе',
      14: 'Сдать ба\u00ADта\u00ADрей\u00ADки',
      15: 'За\u00ADбро\u00ADни\u00ADро\u00ADвать пе\u00ADре\u00ADго\u00ADвор\u00ADку',
      16: 'Ска\u00ADзать «При\u00ADвет!»'
    };

    const AVAILABLE_FLOORS = [9, 11, 13, 17, 19, 21];

    let gameState = {};
    let currentTaskId = null;
    let tempSelectedFloors = [];
    let shuffledTasks = [];

    // Fisher-Yates Shuffle Algorithm
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function iconHTML(task) {
      if (task.img) {
        return `<img class="icon-img" src="${task.img}" alt="${task.title}">`;
      }
      return `<div class="icon">${task.icon}</div>`;
    }

    function floorText(task) {
      if (task.floors.includes('any')) return 'любой этаж';
      if (task.multi) return `${task.floors.join(' и ')} этаж`;
      return `${task.floors[0]} этаж`;
    }

    let pendingWin = false;

    function stripLinks(html) {
      return String(html).replace(/<a\b[^>]*>(.*?)<\/a>/gi, '$1');
    }

    function showExplanation(task) {
      const modal = document.getElementById('explain-modal');
      const iconEl = document.getElementById('explain-icon');

      if (task.img) {
        iconEl.src = task.img;
        iconEl.style.display = 'block';
      } else {
        iconEl.removeAttribute('src');
        iconEl.style.display = 'none';
      }

      document.getElementById('explain-title').textContent = task.title;
      document.getElementById('explain-floor').textContent = floorText(task);
      document.getElementById('explain-text').innerHTML = PLAIN[task.id] || stripLinks(task.explain);

      modal.classList.add('active');
    }

    function hideExplanation() {
      document.getElementById('explain-modal').classList.remove('active');
      if (pendingWin) {
        pendingWin = false;
        showWinOverlay();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (window.emailjs && EMAILJS_CONFIG.publicKey) {
        emailjs.init({ publicKey: EMAILJS_CONFIG.publicKey });
      }
      shuffledTasks = shuffleArray(TASKS);
      loadState();
      renderGrid();
      updateProgress();

      const allDone = Object.values(gameState).filter(s => s.completed).length === TASKS.length;
      if (allDone) {
        setTimeout(showWinOverlay, 400);
      }

      const params = new URLSearchParams(location.search);
      if (params.get('memo') === '1' || params.get('pdf') === '1') {
        setTimeout(showWinOverlay, 350);
      }
    });

    let gridResizeTimer = null;
    window.addEventListener('resize', () => {
      if (gridResizeTimer) clearTimeout(gridResizeTimer);
      gridResizeTimer = setTimeout(() => { renderGrid(); }, 150);
    });

    function memoShareLink() {
      return new URL('pamyatka-po-ofisu.pdf', location.href).toString();
    }

    function fallbackCopy(text, cb) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        cb();
      } catch (e) {
        showNotification('Не удалось скопировать. Ссылка: ' + text);
      }
      ta.remove();
    }

    function copyMemoLink() {
      const link = memoShareLink();
      const done = () => showNotification('Ссылка скопирована');
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(link).then(done).catch(() => fallbackCopy(link, done));
      } else {
        fallbackCopy(link, done);
      }
    }

    function showNotification(message) {
      const box = document.getElementById('notification-box');
      box.innerText = message;
      box.classList.add('show');
      setTimeout(() => {
        box.classList.remove('show');
      }, 3000);
    }

    function loadState() {
      const saved = localStorage.getItem('2gis_bingo_state');
      if (saved) {
        try { gameState = JSON.parse(saved); } catch (e) { gameState = {}; }
      }
    }

    function saveState() {
      localStorage.setItem('2gis_bingo_state', JSON.stringify(gameState));
    }

    function measureWordWidth(word, refEl) {
      const cs = getComputedStyle(refEl);
      const span = document.createElement('span');
      span.style.position = 'absolute';
      span.style.left = '-9999px';
      span.style.top = '0';
      span.style.visibility = 'hidden';
      span.style.whiteSpace = 'nowrap';
      span.style.fontFamily = cs.fontFamily;
      span.style.fontSize = cs.fontSize;
      span.style.fontWeight = cs.fontWeight;
      span.style.letterSpacing = cs.letterSpacing;
      span.textContent = word;
      document.body.appendChild(span);
      const w = span.getBoundingClientRect().width;
      span.remove();
      return w;
    }

    function formatTitleText(task, maxWidth, refEl) {
      const plainWords = task.title.split(' ');
      const hyphWords = (HYPH[task.id] || task.title).split(' ');
      return plainWords.map((word, i) => {
        if (maxWidth > 0 && measureWordWidth(word, refEl) > maxWidth) {
          return hyphWords[i] || word;
        }
        return word;
      }).join(' ');
    }

    function renderGrid() {
      const gridContainer = document.getElementById('bingo-grid');
      gridContainer.innerHTML = '';

      shuffledTasks.forEach(task => {
        const state = gameState[task.id] || {};
        const isCompleted = !!state.completed;

        const card = document.createElement('div');
        card.className = `bingo-card ${isCompleted ? 'completed' : ''}`;
        card.id = `card-${task.id}`;
        card.onclick = () => openModal(task.id);

        let floorLabel = '';
        if (isCompleted) {
          if (state.selectedFloors && state.selectedFloors.includes('any')) {
            floorLabel = 'Любой этаж';
          } else if (task.floors.includes('any')) {
            floorLabel = 'Любой этаж';
          } else {
            floorLabel = state.selectedFloors ? `${state.selectedFloors.join(', ')} эт.` : `${task.floors.join(', ')} эт.`;
          }
        }

        card.innerHTML = `
          ${iconHTML(task)}
          <div class="title"></div>
          ${isCompleted ? `<div class="floor-tag">${floorLabel}</div>` : ''}
        `;

        gridContainer.appendChild(card);

        const titleEl = card.querySelector('.title');
        if (task.lines) {
          titleEl.innerHTML = '';
          task.lines.forEach((line, i) => {
            if (i > 0) titleEl.appendChild(document.createElement('br'));
            titleEl.appendChild(document.createTextNode(line));
          });
        } else {
          const cs = getComputedStyle(card);
          const maxW = card.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
          titleEl.textContent = formatTitleText(task, maxW, titleEl);
        }
      });
    }

    function openModal(taskId) {
      const task = TASKS.find(t => t.id === taskId);
      const state = gameState[taskId] || {};

      if (state.completed) {
        showExplanation(task);
        return;
      }

      currentTaskId = taskId;
      tempSelectedFloors = state.selectedFloors ? [...state.selectedFloors] : [];

      const titleEl = document.getElementById('modal-task-title');
      titleEl.innerHTML = task.img
        ? `<img class="modal-icon-img" src="${task.img}" alt=""> <span>${task.title}</span>`
        : `${task.icon} ${task.title}`;

      renderFloorsGrid(task);
      document.getElementById('floor-modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('floor-modal').classList.remove('active');
      currentTaskId = null;
      tempSelectedFloors = [];
    }

    function renderFloorsGrid(task) {
      const container = document.getElementById('floors-container');
      container.innerHTML = '';

      const anyBtn = document.createElement('button');
      const isAnySelected = tempSelectedFloors.includes('any');
      anyBtn.className = `btn-floor btn-any ${isAnySelected ? 'selected' : ''}`;
      anyBtn.innerText = '✨ На любом этаже';
      anyBtn.onclick = () => selectFloor('any');
      container.appendChild(anyBtn);

      AVAILABLE_FLOORS.forEach(floor => {
        const btn = document.createElement('button');
        const isSelected = tempSelectedFloors.includes(floor);
        btn.className = `btn-floor ${isSelected ? 'selected' : ''}`;
        btn.innerText = `${floor} этаж`;
        btn.onclick = () => selectFloor(floor);
        container.appendChild(btn);
      });
    }

    function selectFloor(floor) {
      const task = TASKS.find(t => t.id === currentTaskId);
      const cardEl = document.getElementById(`card-${task.id}`);

      if (floor === 'any') {
        tempSelectedFloors = ['any'];
      } else {
        if (task.multi) {
          if (tempSelectedFloors.includes('any')) tempSelectedFloors = [];
          if (tempSelectedFloors.includes(floor)) {
            tempSelectedFloors = tempSelectedFloors.filter(f => f !== floor);
          } else {
            tempSelectedFloors.push(floor);
          }
        } else {
          tempSelectedFloors = [floor];
        }
      }

      let isCorrect = false;
      
      // Strict floor check logic
      if (task.floors.length === 1 && task.floors[0] === 'any') {
        // If the task requires "any", ONLY clicking "any" counts as correct
        isCorrect = tempSelectedFloors.length === 1 && tempSelectedFloors[0] === 'any';
      } else if (task.multi) {
        isCorrect = task.floors.length === tempSelectedFloors.length && task.floors.every(f => tempSelectedFloors.includes(f));
      } else {
        isCorrect = tempSelectedFloors.length === 1 && task.floors.includes(tempSelectedFloors[0]);
      }

      if (isCorrect) {
        gameState[task.id] = { completed: true, selectedFloors: [...tempSelectedFloors] };
        saveState();
        renderGrid();
        updateProgress();
        closeModal();

        const allDone = Object.values(gameState).filter(s => s.completed).length === TASKS.length;
        pendingWin = allDone;
        showExplanation(task);
      } else {
        if (!task.multi || tempSelectedFloors.length >= task.floors.length || tempSelectedFloors.includes('any')) {
          closeModal();
          triggerShake(cardEl);
        } else {
          renderFloorsGrid(task);
        }
      }
    }

    function triggerShake(element) {
      element.classList.add('shake');
      setTimeout(() => {
        element.classList.remove('shake');
      }, 500);
    }

    function updateProgress() {
      const completedCount = Object.values(gameState).filter(s => s.completed).length;
      const total = TASKS.length;
      const percentage = (completedCount / total) * 100;

      document.getElementById('progress-text').innerText = `${completedCount} из ${total}`;
      document.getElementById('progress-fill').style.width = `${percentage}%`;
    }

    function resetProgress() {
      gameState = {};
      pendingWin = false;
      saveState();
      shuffledTasks = shuffleArray(TASKS);
      hideExplanation();
      renderGrid();
      updateProgress();
      showNotification('Прогресс сброшен и карточки перемешаны!');
    }

    function renderWinChecklist() {
      const el = document.getElementById('win-checklist');
      const floorOrder = [9, 11, 13, 17, 19, 21, 'any'];
      const floorLabel = f => f === 'any' ? 'На любом этаже' : `${f} этаж`;

      el.innerHTML = floorOrder.map(f => {
        const tasks = TASKS.filter(t => t.floors.includes(f));
        if (!tasks.length) return '';

        const items = tasks.map(task => `
          <div class="win-item">
            ${task.img ? `<img class="win-item-icon" src="${task.img}" alt="">` : `<span class="win-item-emoji">${task.icon}</span>`}
            <div class="win-item-body">
              <div class="win-item-title">${task.title}</div>
              <div class="win-item-text">${task.explain}</div>
            </div>
          </div>
        `).join('');

        return `<div class="win-group"><div class="win-group-title">${floorLabel(f)}</div>${items}</div>`;
      }).join('');
    }

    function showWinOverlay() {
      renderWinChecklist();
      document.getElementById('win-overlay').classList.add('active');
      initConfetti();
    }

    function closeWinOverlay() {
      document.getElementById('win-overlay').classList.remove('active');
    }

    function buildMemoHTML() {
      const logo = document.querySelector('.brand-logo');
      const logoUrl = logo ? logo.src : '';

      const floorOrder = [9, 11, 13, 17, 19, 21, 'any'];
      const floorLabel = f => f === 'any' ? 'На любом этаже' : `${f} этаж`;

      const groups = floorOrder.map(f => {
        const tasks = TASKS.filter(t => t.floors.includes(f));
        if (!tasks.length) return '';

        const items = tasks.map(task => {
          const icon = task.img
            ? `<img class="pi-icon" src="${task.img}" alt="">`
            : `<span class="pi-emoji">${task.icon}</span>`;
          return `
            <div class="pdf-item">
              ${icon}
              <div class="pi-body">
                <div class="pi-title">${task.title}</div>
                <div class="pi-text">${task.explain}</div>
              </div>
            </div>
          `;
        }).join('');

        return `<div class="pdf-group"><div class="pdf-group-title">${floorLabel(f)}</div>${items}</div>`;
      }).join('');

      return `
        <div class="pdf-memo" id="pdf-memo">
          <div class="pdf-head">
            ${logoUrl ? `<img class="pdf-logo" src="${logoUrl}" alt="2ГИС">` : ''}
            <div class="pdf-title">Чек-лист по офису 2ГИС</div>
          </div>
          <div class="pdf-items">${groups}</div>
        </div>
      `;
    }

    async function createMemoPdf() {
      if (!window.html2canvas) {
        throw new Error('html2canvas не загружен');
      }

        const wrapper = document.createElement('div');
        wrapper.innerHTML = buildMemoHTML();
        const memo = wrapper.firstElementChild;
        document.body.appendChild(memo);

        const imgs = Array.from(memo.querySelectorAll('img'));
        await Promise.all(imgs.map(img => img.complete
          ? Promise.resolve()
          : new Promise(res => { img.onload = res; img.onerror = res; })));
        await new Promise(res => setTimeout(res, 60));

        const memoRect = memo.getBoundingClientRect();
        const pxToMm = 210 / memoRect.width;
        const linkBoxes = Array.from(memo.querySelectorAll('a')).map(a => {
          const r = a.getBoundingClientRect();
          return {
            x: (r.left - memoRect.left) * pxToMm,
            y: (r.top - memoRect.top) * pxToMm,
            w: r.width * pxToMm,
            h: r.height * pxToMm,
            url: a.href
          };
        });

        const canvas = await window.html2canvas(memo, {
          scale: 2,
          backgroundColor: '#f6f3e6',
          useCORS: true,
          logging: false
        });
        memo.remove();

        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');
        const pageW = 210;
        const pageH = 297;

        const contentHmm = memoRect.height * pxToMm;
        const renderScale = Math.min(1, pageH / contentHmm);
        const renderW = pageW * renderScale;
        const renderH = contentHmm * renderScale;
        const offsetX = (pageW - renderW) / 2;
        const offsetY = 0;

        pdf.setFillColor(246, 243, 230);
        pdf.rect(0, 0, pageW, pageH, 'F');

        const imgData = canvas.toDataURL('image/jpeg', 0.92);
        pdf.addImage(imgData, 'JPEG', offsetX, offsetY, renderW, renderH);

        linkBoxes.forEach(box => {
          const x = offsetX + box.x * renderScale;
          const y = offsetY + box.y * renderScale;
          const w = box.w * renderScale;
          const h = box.h * renderScale;
          if (w > 0 && h > 0) {
            pdf.link(x, y, w, h, { url: box.url });
          }
        });

        return pdf;
    }

    async function downloadMemoPDF() {
      try {
        const pdf = await createMemoPdf();
        pdf.save('2GIS_Office_Memo.pdf');
        showNotification('Памятка (.pdf) успешно скачана!');
      } catch (e) {
        console.error(e);
        showNotification('Ошибка при создании PDF файла');
      }
    }

    function initConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = Array.from({ length: 80 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height - canvas.height,
        color: ['#86ca38', '#aed3f2', '#f9d8c4', '#ffd166'][Math.floor(Math.random() * 4)],
        size: Math.random() * 8 + 4,
        speedY: Math.random() * 3 + 2,
        speedX: Math.random() * 2 - 1
      }));

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.y += p.speedY;
          p.x += p.speedX;
          if (p.y > canvas.height) p.y = -10;
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, p.size, p.size);
        });
        if (document.getElementById('win-overlay').classList.contains('active')) {
          requestAnimationFrame(render);
        }
      }
      render();
    }
  </script>
</body>
